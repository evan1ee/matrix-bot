services:
  matrix-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: matrix-bot:latest
    container_name: matrix-bot
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - ENVIRONMENT=${ENVIRONMENT:-}
      - DATABASE_URL=sqlite:///app/data/bot_data.db?mode=rwc
      - DATABASE_MAX_CONNECTIONS=10
      - RUST_LOG=info,matrix_bot=info
      - MATRIX_HOMESERVER=${MATRIX_HOMESERVER:-}
      - MATRIX_USERNAME=${MATRIX_USERNAME:-}
      - MATRIX_PASSWORD=${MATRIX_PASSWORD:-}
      - MATRIX_RECOVERY_KEY=${MATRIX_RECOVERY_KEY:-}
      - MATRIX_VERIFICATION_ALLOWLIST=${MATRIX_VERIFICATION_ALLOWLIST:-}
      - API_REGISTRATION_SECRET=${API_REGISTRATION_SECRET:-}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:8080}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - AI_ENDPOINT=${AI_ENDPOINT:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_PROXY=${AI_PROXY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    volumes:
      - bot-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bot-data:
    name: matrix-bot-data
