services:
  matrix-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: matrix-bot:latest
    container_name: matrix-bot
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - ENVIRONMENT=${ENVIRONMENT:-}
      # SQLite by default: no second container, and the data lives in the
      # bot-data volume below. Override to run against PostgreSQL:
      #   DATABASE_URL=postgres://bot:bot@postgres:5432/matrix_bot docker compose --profile postgres up
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/data/bot_data.db?mode=rwc}
      - DATABASE_MAX_CONNECTIONS=10
      - RUST_LOG=info,matrix_bot=info
      - MATRIX_HOMESERVER=${MATRIX_HOMESERVER:-}
      - MATRIX_USERNAME=${MATRIX_USERNAME:-}
      - MATRIX_PASSWORD=${MATRIX_PASSWORD:-}
      - MATRIX_RECOVERY_KEY=${MATRIX_RECOVERY_KEY:-}
      - MATRIX_VERIFICATION_ALLOWLIST=${MATRIX_VERIFICATION_ALLOWLIST:-}
      - API_REGISTRATION_SECRET=${API_REGISTRATION_SECRET:-}
      - INVITE_SECRET=${INVITE_SECRET:-}
      - REGISTRATION_OPEN=${REGISTRATION_OPEN:-}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:8080}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - AI_ENDPOINT=${AI_ENDPOINT:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_PROXY=${AI_PROXY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # No colon before the default: `${VAR-default}` keeps an explicitly
      # empty `.env` value empty (the bot reads empty as "not configured", so
      # this is how an operator switches the feature off), while an unset
      # variable still falls back to the bundled inference server.
      - OCR_BASE_URL=${OCR_BASE_URL-http://inference:8090}
      - STT_BASE_URL=${STT_BASE_URL-http://inference:8090/v1}
      - STT_API_KEY=${STT_API_KEY:-}
      - STT_MODEL=${STT_MODEL:-sensevoice-small}
      - VOICE_LANGUAGE=${VOICE_LANGUAGE:-auto}
      - TTS_BASE_URL=${TTS_BASE_URL-http://inference:8090/v1}
      - TTS_API_KEY=${TTS_API_KEY:-}
      - TTS_MODEL=${TTS_MODEL:-kokoro}
      - TTS_VOICE=${TTS_VOICE:-0}
      - TTS_DIALECT=${TTS_DIALECT:-openai}
    volumes:
      - bot-data:/app/data
    # `required: false` so the default SQLite run does not pull in a database
    # container it has no use for. Needs Compose 2.20+; on older versions the
    # bot's `restart: unless-stopped` covers it, since a boot against an
    # unreachable server exits and is retried.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Only started with `--profile postgres`. The bot defaults to SQLite, so this
  # stays out of the way unless asked for.
  postgres:
    image: postgres:18
    container_name: matrix-bot-postgres
    restart: unless-stopped
    profiles: [postgres]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bot}
      - POSTGRES_DB=${POSTGRES_DB:-matrix_bot}
    # PostgreSQL uses shared memory for parallel query workers, and Docker's
    # 64 MB default is not enough — it surfaces as "could not resize shared
    # memory segment" rather than anything that names the real cause.
    shm_size: 1gb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d ${POSTGRES_DB:-matrix_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Local ONNX model inference, reached only from the bot over the compose
  # network. Deliberately not published to the host: it has no authentication,
  # which is safe on an internal network and is not safe anywhere else.
  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    image: matrix-bot-inference:latest
    container_name: matrix-bot-inference
    restart: unless-stopped
    environment:
      - INFERENCE_PORT=8090
      - OCR_MODEL_DIR=/app/data/ocr_models
      - VOICE_MODEL_DIR=/app/data/voice_models
      - TTS_MODEL_DIR=/app/data/tts_models/kokoro-multi-lang-v1_1
      - RUST_LOG=info,matrix_bot_inference=info
    volumes:
      - inference-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bot-data:
    name: matrix-bot-data
  inference-data:
    name: matrix-bot-inference-data
  postgres-data:
    name: matrix-bot-postgres-data
