[package]
name = "matrix-bot"
version = "0.1.0"
edition = "2021"
default-run = "matrix-bot"

[lib]
name = "matrix_bot"
path = "src/lib.rs"

[[bin]]
name = "matrix-bot"
path = "src/main.rs"

[[bin]]
name = "generate-openapi"
path = "src/bin/generate_openapi.rs"

[dependencies]
matrix-sdk = { version = "0.7", features = ["e2e-encryption"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "migrate"] }
# Dropping sqlx's `sqlite` feature above removed the only crate that asked
# `libsqlite3-sys` (a transitive dependency of matrix-sdk-sqlite, our
# still-required crypto store) to vendor and link its own SQLite. Without this,
# Windows has no system `sqlite3.lib` to link against. This is a build
# dependency only — the application's own database layer never uses it.
libsqlite3-sys = { version = "0.27", features = ["bundled"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "timeout", "limit"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls-webpki-roots", "multipart"] }
utoipa = { version = "4.2", features = ["axum_extras", "chrono"] }
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }
uuid = "1.24.0"
base64 = "0.23.1"
bcrypt = "0.19.3"
ogg = "0.9"
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(not(windows))'.dependencies]
openssl = { version = "0.10" }

