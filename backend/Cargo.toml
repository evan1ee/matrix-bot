[package]
name = "matrix-bot"
version = "0.1.0"
edition = "2021"
default-run = "matrix-bot"

[lib]
name = "matrix_bot"
path = "src/lib.rs"

[[bin]]
name = "matrix-bot"
path = "src/main.rs"

[[bin]]
name = "generate-openapi"
path = "src/bin/generate_openapi.rs"

[dependencies]
matrix-sdk = { version = "0.7", features = ["e2e-encryption"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
jsonwebtoken = "9.3"
bcrypt = "0.15"
reqwest = { version = "0.11", features = ["json"] }
utoipa = { version = "4.2", features = ["axum_extras", "chrono"] }

