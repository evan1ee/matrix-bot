[package]
name = "matrix-bot"
version = "0.1.0"
edition = "2021"
default-run = "matrix-bot"

[lib]
name = "matrix_bot"
path = "src/lib.rs"

[[bin]]
name = "matrix-bot"
path = "src/main.rs"

[[bin]]
name = "generate-openapi"
path = "src/bin/generate_openapi.rs"

[dependencies]
matrix-sdk = { version = "0.18", features = ["e2e-encryption", "bundled-sqlite"] }
# matrix-sdk 0.16 dropped its `crypto` re-export; `bot/media.rs` decrypts
# attachments with `AttachmentDecryptor` directly. Keep in lockstep with matrix-sdk.
matrix-sdk-crypto = "0.18"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "timeout", "limit"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls-webpki-roots", "multipart", "stream"] }
utoipa = { version = "4.2", features = ["axum_extras", "chrono"] }
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }
uuid = "1.24.0"
base64 = "0.23.1"
bcrypt = "0.19.3"
ogg = "0.9"
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(not(windows))'.dependencies]
openssl = { version = "0.10" }

