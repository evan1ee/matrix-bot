name: Release Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: matrix-bot-linux-x86_64
            archive_format: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact_name: matrix-bot-linux-arm64
            archive_format: tar.gz
            allow_failure: true
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: matrix-bot-macos-arm64
            archive_format: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: matrix-bot-windows-x86_64
            archive_format: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend SPA bundle
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Build release binary
        run: cargo build --release --bin matrix-bot --target ${{ matrix.target }}

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release_pkg
          cp "target/${{ matrix.target }}/release/matrix-bot" release_pkg/
          chmod +x release_pkg/matrix-bot
          cp -P "target/${{ matrix.target }}/release"/*.so* release_pkg/ 2>/dev/null || true
          cp -P "target/${{ matrix.target }}/release"/*.dylib* release_pkg/ 2>/dev/null || true
          cp .env.example release_pkg/
          cp README.md release_pkg/
          if [ -f LICENSE ]; then cp LICENSE release_pkg/; fi
          tar -czvf "${{ matrix.artifact_name }}.tar.gz" -C release_pkg .
          sha256sum "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_pkg
          Copy-Item "target/${{ matrix.target }}/release/matrix-bot.exe" -Destination release_pkg/
          Copy-Item "target/${{ matrix.target }}/release/*.dll" -Destination release_pkg/ -ErrorAction SilentlyContinue
          Copy-Item .env.example -Destination release_pkg/
          Copy-Item README.md -Destination release_pkg/
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination release_pkg/ }
          Compress-Archive -Path release_pkg/* -DestinationPath "${{ matrix.artifact_name }}.zip" -Force
          Get-FileHash -Algorithm SHA256 "${{ matrix.artifact_name }}.zip" | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding ascii "${{ matrix.artifact_name }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_format }}
            ${{ matrix.artifact_name }}.${{ matrix.archive_format }}.sha256

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_format }}
            ${{ matrix.artifact_name }}.${{ matrix.archive_format }}.sha256
          generate_release_notes: true
