name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend:
    name: Backend CI (check, test, format, openapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Installed explicitly rather than assumed from the runner image.
      # GitHub's ubuntu-latest happens to ship these, so this job worked without
      # them; a self-hosted act_runner's default image (node:20-bullseye) does
      # not, and the build fails on a missing cmake. release.yml has installed
      # the same three for its Linux target all along.
      #
      # cmake builds the vendored libopus inside opusic-sys; reqwest pulls in
      # native-tls, which needs the OpenSSL headers and pkg-config to find them.
      - name: Install Linux build dependencies
        run: |
          set -eu
          # A GitHub runner is a non-root user with sudo; a container-based
          # act_runner is usually root with no sudo installed. Assuming either
          # one would repeat the mistake this step exists to fix.
          if [ "$(id -u)" -eq 0 ]; then sudo=""; else sudo="sudo"; fi
          $sudo apt-get update
          $sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-rust"

      # Swatinem/rust-cache prunes dynamic libraries (.so) during cache pruning.
      # If we only delete target/sherpa-onnx-prebuilt, Cargo still believes
      # sherpa-onnx-sys has already been built from the restored cache and skips
      # running build.rs, which results in linker errors ("unable to find library -lsherpa-onnx-c-api").
      # Cleaning sherpa-onnx-sys forces Cargo to re-run its build script and fetch the .so files.
      # `sherpa-onnx-sys`'s build script downloads a prebuilt archive from GitHub
      # releases, and the clean step below deliberately forces it to run again.
      # That put an unauthenticated external download on the critical path of
      # every build, and it failed once already when both backend jobs fetched
      # the same asset at the same time.
      #
      # The build script looks in `SHERPA_ONNX_ARCHIVE_DIR` before downloading,
      # so the archive is cached here and the download becomes a cache-miss-only
      # path with retries, instead of something every run depends on.
      - name: Resolve the sherpa-onnx version
        id: sherpa
        run: |
          set -euo pipefail
          version="$(grep -A1 'name = "sherpa-onnx-sys"' Cargo.lock | grep '^version' | cut -d'"' -f2)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=sherpa-onnx-v$version-linux-x64-shared-lib.tar.bz2" >> "$GITHUB_OUTPUT"
          # Exported here rather than in a job-level `env:` block, because the
          # `runner` context is not available there — only in steps.
          echo "SHERPA_ONNX_ARCHIVE_DIR=$RUNNER_TEMP/sherpa-archive" >> "$GITHUB_ENV"

      - name: Cache the sherpa-onnx prebuilt archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sherpa-archive
          # Keyed on the version from Cargo.lock, so a dependency bump misses
          # the cache and refetches rather than silently using a stale archive.
          key: sherpa-onnx-${{ steps.sherpa.outputs.version }}-linux-x64-shared

      - name: Fetch the sherpa-onnx archive if the cache missed
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sherpa-archive"
          name="${{ steps.sherpa.outputs.archive }}"
          mkdir -p "$dir"
          if [ -f "$dir/$name" ]; then
            echo "archive already cached: $name"
            exit 0
          fi
          # Retries are the point: a single refused request is what broke a run.
          curl --proto '=https' --tlsv1.2 --location --fail --show-error --silent \
               --retry 5 --retry-all-errors --retry-delay 5 \
               --output "$dir/$name" \
               "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${{ steps.sherpa.outputs.version }}/$name"

      - name: Clean sherpa-onnx prebuilt cache
        run: |
          cargo clean -p sherpa-onnx-sys -p sherpa-onnx || true
          rm -rf target/sherpa-onnx-prebuilt

      - name: Format check
        run: cargo fmt --all -- --check

      # Scoped to the bot crate. `--workspace` would drag the inference crate's
      # native ML dependencies back into this job, which is the cost this
      # split exists to remove.
      - name: Run backend tests & check targets
        run: cargo test -p matrix-bot --all-targets

      - name: Verify OpenAPI spec is up-to-date
        run: |
          cargo run --bin generate-openapi
          git diff --exit-code backend/openapi.json

  backend-postgres:
    name: Backend CI (PostgreSQL dialect)
    runs-on: ubuntu-latest

    # This job runs inside a container, unlike every other job in this file,
    # and that is the point rather than an incidental preference.
    #
    # A service container is reachable at `127.0.0.1` only from a job running
    # directly on the runner machine, which is what GitHub's hosted runner
    # does. A job running *inside* a container reaches it at the service's
    # label instead — `postgres` — since the two share a user-defined bridge
    # network. A self-hosted act_runner always runs the job in a container, so
    # the `127.0.0.1` spelling that worked on GitHub failed there for every
    # database test at once: 357 failed with "TEST_DATABASE_URL must point at
    # a reachable server" while the 364 touching no database passed.
    #
    # Correcting only the hostname would move the breakage to whichever runner
    # it was not written for, so the job is pinned into a container on both and
    # one spelling is then right everywhere.
    #
    # The image has to carry Node.js: that is what JavaScript actions
    # (checkout, rust-cache, cache) execute with inside a job container, and
    # act_runner does not inject it — its own default labels are `node:*`
    # images for this reason. A `rust:*` image would fail at the first `uses:`.
    # So Node is what the image is chosen for, and the Rust toolchain is
    # installed below exactly as in the SQLite job, keeping both on `stable`.
    # node:20-bookworm builds on buildpack-deps, so git, curl and a C toolchain
    # are already there and cmake is the only real addition.
    container: node:20-bookworm

    # The same suite, against a real PostgreSQL. The SQLite job above is the
    # fast default; this one exists because SQLite accepts plenty that Postgres
    # rejects — `completed = 0` for a boolean, bare `TIMESTAMP` for a
    # `DateTime<Utc>`, `INTEGER` where an `i64` is read — and each of those was
    # a live defect found only this way. See docs/POSTGRES_MIGRATION.md.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: bot
        # No `ports:` mapping. Publishing to the runner's host only helps a job
        # running on that host; containers on one network already reach each
        # other's ports directly.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Every test opens its own schema on this server instead of an in-memory
      # SQLite database. The host is the service's label, per the container
      # note above — never `127.0.0.1`.
      TEST_DATABASE_URL: postgres://postgres:bot@postgres:5432/postgres
      # The #[ignore]d live tests read this one.
      PG_TEST_URL: postgres://postgres:bot@postgres:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Installed explicitly rather than assumed from the runner image.
      # GitHub's ubuntu-latest happens to ship these, so this job worked without
      # them; a self-hosted act_runner's default image (node:20-bullseye) does
      # not, and the build fails on a missing cmake. release.yml has installed
      # the same three for its Linux target all along.
      #
      # cmake builds the vendored libopus inside opusic-sys; reqwest pulls in
      # native-tls, which needs the OpenSSL headers and pkg-config to find them.
      - name: Install Linux build dependencies
        run: |
          set -eu
          # A GitHub runner is a non-root user with sudo; a container-based
          # act_runner is usually root with no sudo installed. Assuming either
          # one would repeat the mistake this step exists to fix.
          if [ "$(id -u)" -eq 0 ]; then sudo=""; else sudo="sudo"; fi
          $sudo apt-get update
          $sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-rust"

      # Same reason as the SQLite job: cache pruning drops the .so files while
      # Cargo still believes sherpa-onnx-sys is built.
      # `sherpa-onnx-sys`'s build script downloads a prebuilt archive from GitHub
      # releases, and the clean step below deliberately forces it to run again.
      # That put an unauthenticated external download on the critical path of
      # every build, and it failed once already when both backend jobs fetched
      # the same asset at the same time.
      #
      # The build script looks in `SHERPA_ONNX_ARCHIVE_DIR` before downloading,
      # so the archive is cached here and the download becomes a cache-miss-only
      # path with retries, instead of something every run depends on.
      - name: Resolve the sherpa-onnx version
        id: sherpa
        run: |
          set -euo pipefail
          version="$(grep -A1 'name = "sherpa-onnx-sys"' Cargo.lock | grep '^version' | cut -d'"' -f2)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=sherpa-onnx-v$version-linux-x64-shared-lib.tar.bz2" >> "$GITHUB_OUTPUT"
          # Exported here rather than in a job-level `env:` block, because the
          # `runner` context is not available there — only in steps.
          echo "SHERPA_ONNX_ARCHIVE_DIR=$RUNNER_TEMP/sherpa-archive" >> "$GITHUB_ENV"

      - name: Cache the sherpa-onnx prebuilt archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sherpa-archive
          # Keyed on the version from Cargo.lock, so a dependency bump misses
          # the cache and refetches rather than silently using a stale archive.
          key: sherpa-onnx-${{ steps.sherpa.outputs.version }}-linux-x64-shared

      - name: Fetch the sherpa-onnx archive if the cache missed
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sherpa-archive"
          name="${{ steps.sherpa.outputs.archive }}"
          mkdir -p "$dir"
          if [ -f "$dir/$name" ]; then
            echo "archive already cached: $name"
            exit 0
          fi
          # Retries are the point: a single refused request is what broke a run.
          curl --proto '=https' --tlsv1.2 --location --fail --show-error --silent \
               --retry 5 --retry-all-errors --retry-delay 5 \
               --output "$dir/$name" \
               "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${{ steps.sherpa.outputs.version }}/$name"

      - name: Clean sherpa-onnx prebuilt cache
        run: |
          cargo clean -p sherpa-onnx-sys -p sherpa-onnx || true
          rm -rf target/sherpa-onnx-prebuilt

      # Scoped to the bot crate. `--workspace` would drag the inference crate's
      # native ML dependencies back into this job, which is the cost this
      # split exists to remove.
      - name: Run the suite against PostgreSQL
        run: cargo test -p matrix-bot

      # These are #[ignore]d because they need a server, which is exactly what
      # this job has. They cover the boot path, the schema, the audit-log
      # triggers and the merge savepoints.
      - name: Run the live PostgreSQL tests
        run: cargo test --package matrix-bot live_postgres -- --ignored --test-threads=1

  inference:
    name: Inference CI (check, test, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-inference"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Run inference tests
        run: cargo test -p matrix-bot-inference --all-targets

  frontend:
    name: Frontend CI (build & typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Frontend build
        run: npm --prefix frontend run build
