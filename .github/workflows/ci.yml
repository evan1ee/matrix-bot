name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend:
    name: Backend CI (check, test, format, openapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-rust"

      # Swatinem/rust-cache strips or prunes dynamic libraries (.so) during cache
      # pruning, leaving an empty `target/sherpa-onnx-prebuilt/.../lib` folder.
      # sherpa-onnx-sys detects that directory exists, skips downloading the archive,
      # and panics because no .so files are present. Removing it forces a clean download.
      - name: Clean sherpa-onnx prebuilt cache
        run: rm -rf target/sherpa-onnx-prebuilt

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Run backend tests & check targets
        run: cargo test --workspace --all-targets

      - name: Verify OpenAPI spec is up-to-date
        run: |
          cargo run --bin generate-openapi
          git diff --exit-code backend/openapi.json

  frontend:
    name: Frontend CI (build & typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Frontend build
        run: npm --prefix frontend run build
