name: Build Docker image

# Manual only — this never fires on push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (also always tagged with the short commit SHA)"
        required: true
        default: latest
      push:
        description: "Push to GHCR (uncheck to build only)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase paths; github.repository is not guaranteed to be
      # lowercase, so normalize it rather than relying on the current spelling.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.tag }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '```'
            echo "${{ steps.image.outputs.name }}:${{ inputs.tag }}"
            echo "${{ steps.image.outputs.name }}:${{ github.sha }}"
            echo '```'
            echo "Pushed: ${{ inputs.push }}"
          } >> "$GITHUB_STEP_SUMMARY"
